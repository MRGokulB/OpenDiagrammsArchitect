version: '3.8'
services:
  opendiagram-architect:
    build: .
    ports:
      - "${APP_PORT:-3001}:3000"
    volumes:
      # Maps your local host 'workspace' directory strictly into the Docker instance
      # This guarantees that files saved via the internal Docker API are physically accessible natively on your PC
      - ./workspace:/app/workspace
    environment:
      - NODE_ENV=production
